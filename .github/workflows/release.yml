name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The tag is the only place a version is written, and it is read once here: the pack and the
  # six publishes all take this output, which is what makes the artefacts agree without anyone
  # editing a file.
  version:
    name: The version this tag names
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # 'v1.0' would name the binaries 1.0 while NuGet normalises the package to 1.0.0, leaving
      # a release whose artefacts disagree about their own version. Refused before anything is
      # built rather than noticed on the release page.
      - name: Read and check the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "The tag '$GITHUB_REF_NAME' does not name a version: expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ADR-0004: the primary artefact. Packed and started here; published only once the binaries
  # have been built and started too, so a half-releasable tag leaves the feed untouched.
  package:
    name: Pack and smoke-test the tool
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The version reaches the build as well as the pack: packed from an assembly built at the
      # default 1.0.0, the tool would report a version its package does not carry.
      - name: Build
        run: |
          dotnet build -c Release -p:ContinuousIntegrationBuild=true \
            -p:Version=$VERSION

      - name: Test
        run: |
          for project in \
            tests/JiraServerMcp.Jira.Tests \
            tests/JiraServerMcp.Tests \
            tests/JiraServerMcp.Protocol.Tests \
            tests/JiraServerMcp.JiraIntegration.Tests
          do
            dotnet test "$project" --no-build -c Release \
              -p:Version=$VERSION \
              -- --filter-not-trait "Category=JiraIntegration"
          done

      - name: Pack
        run: |
          dotnet pack src/JiraServerMcp --no-build -c Release \
            -p:ContinuousIntegrationBuild=true \
            -p:Version=$VERSION \
            -o package

      # A release that ships a package which cannot start is worse than no release. Both verbs
      # need no Jira, and both print to standard error: standard output belongs to the protocol
      # (ADR-0002).
      #
      # '--source' rather than '--add-source': the latter appends to the configured feeds, so a
      # package of this name published anywhere else could be installed and executed here while
      # the release reported itself smoke-tested.
      - name: The packed tool installs and runs
        run: |
          dotnet tool install jira-server-mcp \
            --version $VERSION \
            --source ./package --tool-path ./tool
          ./tool/jira-server-mcp --version 2>&1 \
            | grep -q "^$VERSION"
          ./tool/jira-server-mcp profile list 2>&1 | grep -q "No profiles yet"

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: package/

  # Cross-published from one runner: self-contained single-file needs no native toolchain, and
  # six runners would buy nothing but six cold caches.
  binaries:
    name: ${{ matrix.runtime }}
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64, osx-arm64, osx-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Untrimmed on purpose: the MCP SDK discovers tools by reflection and System.Text.Json
      # binds by reflection, so a trimmed binary trades disk space for a runtime failure on
      # whichever platform nobody smoke-tested.
      - name: Publish
        run: |
          dotnet publish src/JiraServerMcp -c Release \
            -r ${{ matrix.runtime }} --self-contained true \
            -p:ContinuousIntegrationBuild=true \
            -p:Version=$VERSION \
            -o publish/${{ matrix.runtime }}

      - name: The Linux binary starts
        if: matrix.runtime == 'linux-x64'
        run: |
          ./publish/linux-x64/jira-server-mcp --version 2>&1 \
            | grep -q "^$VERSION"
          ./publish/linux-x64/jira-server-mcp profile list 2>&1 | grep -q "No profiles yet"

      # One file per runtime identifier, named for the version and the platform it runs on, with
      # the checksum a downloader can check it against.
      - name: Name and checksum the artefact
        run: |
          mkdir -p dist/bin dist/sums
          name="jira-server-mcp-$VERSION-${{ matrix.runtime }}"
          case "${{ matrix.runtime }}" in
            win-*) cp "publish/${{ matrix.runtime }}/jira-server-mcp.exe" "dist/bin/$name.exe" ;;
            *)     cp "publish/${{ matrix.runtime }}/jira-server-mcp" "dist/bin/$name" ;;
          esac
          cd dist/bin
          for file in *; do sha256sum "$file" > "../sums/$file.sha256"; done
          cat ../sums/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.runtime }}
          path: dist/

  publish:
    name: Publish
    needs: [package, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            package/*.nupkg
            dist/bin/*

      # GitHub Packages, not the public gallery: nuget.org publication waits until the tool
      # surface stops moving, and will use trusted publishing over OIDC when it happens.
      - name: Publish the tool to GitHub Packages
        run: |
          dotnet nuget push "package/*.nupkg" \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate --no-symbols

      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --draft --generate-notes \
            dist/bin/* dist/sums/*
