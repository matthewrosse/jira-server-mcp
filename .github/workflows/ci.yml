name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are worth cancelling; a push to main is not, or the commit is
  # left with no build result at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:ContinuousIntegrationBuild=true

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Audit dependencies
        run: dotnet restore --force-evaluate -warnaserror

      # Jira-backed tests are excluded here by trait, not by project: the harness project also
      # holds the setup-wizard parser and the readiness poller, which need neither Docker nor a
      # Jira and would otherwise run in no pull-request workflow at all. This job must stay under
      # about three minutes. The nightly workflow runs the other side of that trait.
      - name: Test
        run: |
          set -o pipefail
          for project in \
            tests/JiraServerMcp.Jira.Tests \
            tests/JiraServerMcp.Tests \
            tests/JiraServerMcp.Protocol.Tests \
            tests/JiraServerMcp.JiraIntegration.Tests
          do
            log="$(basename "$project").log"
            # The coverage probe prefixes every basic block with an unguarded store into a
            # mapping under the temporary directory; whenever that page loses its backing the
            # test host dies with an AccessViolationException blamed on whichever of our methods
            # happened to be running. It is upstream, and open:
            # https://github.com/microsoft/codecoverage/issues/232. Measured here at 7 crashes
            # in 140 runs, so a run has about a one in twenty chance of reddening for a reason
            # that has nothing to do with the code under test. Only that signature is retried;
            # a test that genuinely fails still fails on the first attempt.
            for attempt in 1 2 3; do
              if dotnet test "$project" --no-build -c Release \
                   -- --filter-not-trait "Category=JiraIntegration" \
                      --coverage --coverage-output-format cobertura \
                      --coverage-output "$(basename "$project").cobertura.xml" 2>&1 | tee "$log"
              then
                break
              fi
              grep -q "AccessViolationException" "$log" || exit 1
              if [ "$attempt" = 3 ]; then
                echo "::error::$project crashed in the coverage probe three times running."
                exit 1
              fi
              echo "::warning::$project hit the coverage probe crash (codecoverage#232); retrying."
            done
          done

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("| Report | Lines | Branches |")
          print("| --- | --- | --- |")
          for report in sorted(glob.glob("TestResults/*.cobertura.xml")):
              root = ET.parse(report).getroot()
              # An empty report carries line-rate="1", which would read as full coverage.
              if not int(root.get("lines-valid", 0)):
                  print(f"| {report} | n/a | n/a |")
                  continue
              lines = float(root.get("line-rate", 0)) * 100
              branches = float(root.get("branch-rate", 0)) * 100
              print(f"| {report} | {lines:.1f}% | {branches:.1f}% |")
          PY

  # The credential store is the one component whose behaviour is the operating system's rather
  # than ours, so it is exercised against the genuine Keychain, Credential Manager and Secret
  # Service rather than against a faked process runner alone.
  credential-stores:
    name: Credential stores on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # A hosted Linux runner has no desktop session and therefore no Secret Service. Without
      # one, the genuine contract would skip and this leg would prove nothing.
      - name: Provide a Secret Service
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-tools dbus-x11

      - name: Build
        run: dotnet build tests/JiraServerMcp.Tests -c Release -p:ContinuousIntegrationBuild=true

      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # The keyring daemon is unlocked with an empty password, which also creates the login
            # collection that `secret-tool store` writes into, and lives for the length of the bus
            # session, which is the length of this command. The password arrives as a bare
            # newline: given nothing at all on standard input the daemon takes it as "no password
            # supplied" and tries to raise a graphical prompt, which a headless runner cannot
            # answer.
            mkdir -p ~/.local/share/keyrings
            dbus-run-session -- bash -euo pipefail -c '
              eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets --daemonize)"
              export GNOME_KEYRING_CONTROL
              dotnet test tests/JiraServerMcp.Tests --no-build -c Release \
                -- --filter-class "*CredentialStore*" | tee credential-stores.log
            '
          else
            dotnet test tests/JiraServerMcp.Tests --no-build -c Release \
              -- --filter-class "*CredentialStore*" | tee credential-stores.log
          fi

      # A skip here means the native store was not reachable, which is exactly what this leg
      # exists to rule out.
      - name: The genuine backend was not skipped
        run: |
          grep -q "skipped: 0" credential-stores.log \
            || { echo "The credential store contract skipped a test on $RUNNER_OS."; exit 1; }
