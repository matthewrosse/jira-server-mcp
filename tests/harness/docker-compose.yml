# A canonical Jira Server 8.20.7 for a developer who wants a long-lived local instance.
# Brought up, set up, licensed and seeded by scripts/jira-up.sh; torn down by scripts/jira-down.sh.
#
# CI does not use this file. It starts the same two containers through Testcontainers, and runs the
# same setup, seeding and token minting code — see tests/JiraServerMcp.JiraIntegration.Tests/Harness/.
#
# The licence this is configured with expires three hours after it is applied. That is far longer
# than any test run and much shorter than a working day, so an instance left up overnight will not
# still work in the morning. Tear it down and bring it back up.

name: jira-server-mcp-harness

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: jira
      # Jira requires this collation. Pinned so a different host locale cannot change the result.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jira -d jira"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  jira:
    image: atlassian/jira-software:8.20.7-jdk11
    # The 8.20.7 tag publishes a single-arch amd64 manifest with no arm64 variant, so an Apple
    # Silicon host runs this under emulation — slowly, but it runs. CI runners are amd64 and take
    # this natively.
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ATL_DB_TYPE: postgres72
      # Required, and its absence is silent. The image renders <driver-class> in dbconfig.xml
      # straight from this variable with no default; leave it unset and Jira boots, logs "The
      # database is not yet configured", and shows the wizard's database step as though nothing
      # had been configured. There is no error anywhere. This cost the Phase 0 spike more time
      # than anything else it found.
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_JDBC_URL: jdbc:postgresql://postgres:5432/jira
      ATL_JDBC_USER: jira
      ATL_JDBC_PASSWORD: jira
      ATL_DB_SCHEMA_NAME: public
      JVM_MINIMUM_MEMORY: 1024m
      JVM_MAXIMUM_MEMORY: 2048m
      ATL_TOMCAT_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - jira-home:/var/atlassian/application-data/jira

volumes:
  postgres-data:
  jira-home:
